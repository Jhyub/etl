[package]
name = "etl-cli"
version = "0.1.0"
edition = "2024"
description = "A personal command-line client for SNU eTL assignments"

[[bin]]
name = "etl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
directories = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
url = "2"
